<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Test</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
    <style>
        .test-container {
            padding: 20px;
            margin: 20px;
            border: 2px solid var(--border-primary);
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .test-button {
            padding: 10px 20px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Theme Test Page</h1>
        <p>This page tests the theme switching functionality.</p>
        <p>Current theme: <span id="current-theme">Loading...</span></p>
        <button id="theme-toggle" class="test-button">Toggle Theme</button>
        <button onclick="console.log('Current data-theme:', document.documentElement.getAttribute('data-theme'))" class="test-button">Log Theme</button>
    </div>
    
    <script>
        // Update theme display
        function updateThemeDisplay() {
            const themeSpan = document.getElementById('current-theme');
            const currentTheme = document.documentElement.getAttribute('data-theme');
            themeSpan.textContent = currentTheme || 'none';
        }
        
        // Listen for theme changes
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                    updateThemeDisplay();
                }
            });
        });
        
        observer.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['data-theme']
        });
        
        // Initial update
        updateThemeDisplay();
    </script>
</body>
</html>
