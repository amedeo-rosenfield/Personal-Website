    <script>
        // Gentle scroll to next section (removed since no next section)
        function scrollToNextSection() {
            // No next section to scroll to on home page
        }

        // Enhanced fade-in animations on scroll
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0) translateX(0)';
                }
            });
        }, observerOptions);

        // Apply animations on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Observe sections and cards for scroll animations
            const sections = document.querySelectorAll('.section, .quick-links');
            const cards = document.querySelectorAll('.quick-link-card');
            
            sections.forEach(section => observer.observe(section));
            cards.forEach(card => observer.observe(card));
            
            // Add gentle hover effects to cards
            cards.forEach(card => {
                card.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-8px) scale(1.02)';
                });
                card.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });

            // Handle rocket animation transition from initial to infinite
            const floatingElements = document.querySelectorAll('.floating-element');
            floatingElements.forEach(element => {
                element.addEventListener('animationend', function() {
                    if (!this.classList.contains('initial-animation-complete')) {
                        this.classList.add('initial-animation-complete');
                    }
                });
            });
        });
    </script>

    <!-- Dust particles JavaScript for dark mode -->
    <script>
        const canvas = document.getElementById('dustCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

                            // Create particles
       const numParticles = 20000; // 100x more particles (original was 200)
       const particles = [];
       let activeShootingStars = 0;
       const maxShootingStars = 5;

       for (let i = 0; i < numParticles; i++) {
         const isMotionless = Math.random() < 0.85; // 85% chance of being motionless
         const isMicroscopic = Math.random() < 0.8; // 80% chance of being microscopically small
         const isShootingStar = false; // We'll create shooting stars dynamically

         let speedX = 0;
         let speedY = 0;
         let radius = isMicroscopic ? Math.random() * 0.1 : Math.random() * 0.5;
         let alpha = isMicroscopic ? Math.random() * 0.3 : Math.random() * 0.6;

         if (!isMotionless) {
           // Regular moving particles
           speedX = (Math.random() - 0.5) * 0.1;
           speedY = (Math.random() - 0.5) * 0.1;
         }

         particles.push({
           x: Math.random() * width,
           y: Math.random() * height,
           radius: radius,
           alpha: alpha,
           speedX: speedX,
           speedY: speedY,
           isShootingStar: isShootingStar,
           trail: null,
           createdAt: Date.now()
         });
       }

       // Function to create a new shooting star
       function createShootingStar() {
         if (activeShootingStars >= maxShootingStars) return;

         const shootingStar = {
           x: Math.random() * width,
           y: Math.random() * height,
           radius: Math.random() * 1.5 + 0.5,
           alpha: Math.random() * 0.8 + 0.2,
           speedX: (Math.random() - 0.5) * 3,
           speedY: (Math.random() - 0.5) * 2,
           isShootingStar: true,
           trail: [],
           createdAt: Date.now(),
           lifespan: 3000 // 3 seconds
         };

         particles.push(shootingStar);
         activeShootingStars++;
       }

       // Create shooting stars periodically
       setInterval(createShootingStar, 2000); // Create a new shooting star every 2 seconds

               function animate() {
         ctx.clearRect(0, 0, width, height);
         const currentTime = Date.now();
         
         // Filter out expired shooting stars and update active count
         const validParticles = particles.filter(p => {
           if (p.isShootingStar) {
             const age = currentTime - p.createdAt;
             if (age > p.lifespan) {
               activeShootingStars--;
               return false; // Remove expired shooting star
             }
           }
           return true;
         });
         
         // Update particles array
         particles.length = 0;
         particles.push(...validParticles);
         
         particles.forEach(p => {
           if (p.isShootingStar) {
             const age = currentTime - p.createdAt;
             const fadeOut = Math.max(0, 1 - (age / p.lifespan)); // Fade out over lifespan
             
             // Draw shooting star trail
             if (p.trail.length > 0) {
               ctx.beginPath();
               ctx.moveTo(p.x, p.y);
               for (let i = p.trail.length - 1; i >= 0; i--) {
                 const trailPoint = p.trail[i];
                 ctx.lineTo(trailPoint.x, trailPoint.y);
               }
               ctx.strokeStyle = `rgba(255, 255, 255, ${p.alpha * 0.3 * fadeOut})`;
               ctx.lineWidth = p.radius * 0.5;
               ctx.stroke();
             }

             // Draw shooting star
             ctx.beginPath();
             ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
             ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * fadeOut})`;
             ctx.fill();

             // Update trail
             p.trail.push({x: p.x, y: p.y});
             if (p.trail.length > 10) {
               p.trail.shift();
             }
           } else {
             // Regular particle
             ctx.beginPath();
             ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
             ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
             ctx.fill();
           }

           p.x += p.speedX;
           p.y += p.speedY;

           // Wrap around screen
           if (p.x < 0) p.x = width;
           if (p.x > width) p.x = 0;
           if (p.y < 0) p.y = height;
           if (p.y > height) p.y = 0;
         });
         requestAnimationFrame(animate);
       }

        animate();
    </script>
