    <script>
        // Gentle scroll to next section (removed since no next section)
        function scrollToNextSection() {
            // No next section to scroll to on home page
        }

        // Enhanced fade-in animations on scroll
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0) translateX(0)';
                }
            });
        }, observerOptions);

        // Apply animations on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Observe sections and cards for scroll animations
            const sections = document.querySelectorAll('.section, .quick-links');
            const cards = document.querySelectorAll('.quick-link-card');
            
            sections.forEach(section => observer.observe(section));
            cards.forEach(card => observer.observe(card));
            
            // Add gentle hover effects to cards
            cards.forEach(card => {
                card.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-8px) scale(1.02)';
                });
                card.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });

            // Handle rocket animation transition from initial to infinite
            const floatingElements = document.querySelectorAll('.floating-element');
            floatingElements.forEach(element => {
                element.addEventListener('animationend', function() {
                    if (!this.classList.contains('initial-animation-complete')) {
                        this.classList.add('initial-animation-complete');
                    }
                });
            });
        });
    </script>

    <!-- Dust particles JavaScript for dark mode -->
    <script>
        // Check if canvas is supported
        if (!document.getElementById('dustCanvas')) {
            console.warn('Dust canvas element not found');
        } else {
            try {
                const canvas = document.getElementById('dustCanvas');
                const ctx = canvas.getContext('2d');
                
                if (!ctx) {
                    console.warn('Canvas 2D context not supported');
                } else {
                    let width = canvas.width = window.innerWidth;
                    let height = canvas.height = window.innerHeight;

                    window.addEventListener('resize', () => {
                        width = canvas.width = window.innerWidth;
                        height = canvas.height = window.innerHeight;
                    });

                    // Browser detection and performance optimization
                    const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
                    const isFirefox = /Firefox/.test(navigator.userAgent);
                    const isOlderComputer = navigator.hardwareConcurrency < 4; // Less than 4 CPU cores
                    
                    // Adjust particle count based on browser and performance
                    let numParticles = 3000;
                    let additionalBrightParticles = 600;
                    let ultraTinyParticles = 20000;
                    let additionalUltraTinyParticles = 100000;
                    
                    if (isChrome && isOlderComputer) {
                        // Reduce particles significantly for Chrome on older computers
                        numParticles = 1000;
                        additionalBrightParticles = 200;
                        ultraTinyParticles = 5000;
                        additionalUltraTinyParticles = 20000;
                        console.log('Chrome on older computer detected - reducing particles for performance');
                    } else if (isChrome) {
                        // Moderate reduction for Chrome
                        numParticles = 2000;
                        additionalBrightParticles = 400;
                        ultraTinyParticles = 10000;
                        additionalUltraTinyParticles = 50000;
                        console.log('Chrome detected - moderate particle reduction');
                    } else if (isFirefox) {
                        // Keep full particles for Firefox
                        console.log('Firefox detected - using full particle count');
                    }
                    
                    const particles = [];
                    let activeShootingStars = 0;
                    const maxShootingStars = 25; // Increased for more shooting stars

                    for (let i = 0; i < numParticles; i++) {
                        const isMotionless = Math.random() < 0.9; // 90% chance of being motionless for better performance
                        const isMicroscopic = Math.random() < 0.85; // 85% chance of being microscopically small

                        let speedX = 0;
                        let speedY = 0;
                        let radius = isMicroscopic ? Math.random() * 0.08 : Math.random() * 0.4; // Smaller particles
                        let alpha = isMicroscopic ? Math.random() * 0.35 + 0.1 : Math.random() * 0.6 + 0.2; // Brighter alpha

                        if (!isMotionless) {
                            // Regular moving particles with reduced speed
                            speedX = (Math.random() - 0.5) * 0.08;
                            speedY = (Math.random() - 0.5) * 0.08;
                        }

                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            radius: radius,
                            alpha: alpha,
                            speedX: speedX,
                            speedY: speedY,
                            isShootingStar: false,
                            trail: null,
                            createdAt: Date.now()
                        });
                    }

                    // Add additional brighter dust particles
                    for (let i = 0; i < additionalBrightParticles; i++) {
                        const isMotionless = Math.random() < 0.8; // 80% chance of being motionless
                        const isMicroscopic = Math.random() < 0.7; // 70% chance of being microscopically small

                        let speedX = 0;
                        let speedY = 0;
                        let radius = isMicroscopic ? Math.random() * 0.12 : Math.random() * 0.6; // Slightly larger particles
                        let alpha = isMicroscopic ? Math.random() * 0.5 + 0.3 : Math.random() * 0.7 + 0.4; // Even brighter alpha values

                        if (!isMotionless) {
                            // Moving particles with slightly higher speed
                            speedX = (Math.random() - 0.5) * 0.12;
                            speedY = (Math.random() - 0.5) * 0.12;
                        }

                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            radius: radius,
                            alpha: alpha,
                            speedX: speedX,
                            speedY: speedY,
                            isShootingStar: false,
                            trail: null,
                            createdAt: Date.now()
                        });
                    }

                    // Add very tiny particles for authentic space feel
                    for (let i = 0; i < ultraTinyParticles; i++) {
                        const isMotionless = Math.random() < 0.95; // 95% chance of being motionless for performance
                        const isUltraMicroscopic = Math.random() < 0.9; // 90% chance of being ultra-microscopic

                        let speedX = 0;
                        let speedY = 0;
                        let radius = isUltraMicroscopic ? Math.random() * 0.03 : Math.random() * 0.06; // Extremely tiny particles
                        let alpha = isUltraMicroscopic ? Math.random() * 0.25 + 0.1 : Math.random() * 0.35 + 0.15; // Brighter subtle alpha

                        if (!isMotionless) {
                            // Very slow movement for the few moving particles
                            speedX = (Math.random() - 0.5) * 0.04;
                            speedY = (Math.random() - 0.5) * 0.04;
                        }

                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            radius: radius,
                            alpha: alpha,
                            speedX: speedX,
                            speedY: speedY,
                            isShootingStar: false,
                            trail: null,
                            createdAt: Date.now()
                        });
                    }

                    // Add additional ultra-tiny particles for maximum space immersion
                    for (let i = 0; i < additionalUltraTinyParticles; i++) {
                        const isMotionless = Math.random() < 0.98; // 98% chance of being motionless for performance
                        const isUltraMicroscopic = Math.random() < 0.95; // 95% chance of being ultra-microscopic

                        let speedX = 0;
                        let speedY = 0;
                        let radius = isUltraMicroscopic ? Math.random() * 0.02 : Math.random() * 0.04; // Even tinier particles
                        let alpha = isUltraMicroscopic ? Math.random() * 0.2 + 0.1 : Math.random() * 0.3 + 0.15; // Brighter subtle alpha

                        if (!isMotionless) {
                            // Extremely slow movement for the few moving particles
                            speedX = (Math.random() - 0.5) * 0.02;
                            speedY = (Math.random() - 0.5) * 0.02;
                        }

                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            radius: radius,
                            alpha: alpha,
                            speedX: speedX,
                            speedY: speedY,
                            isShootingStar: false,
                            trail: null,
                            createdAt: Date.now()
                        });
                    }

                    // Function to create a new shooting star
                    function createShootingStar() {
                        if (activeShootingStars >= maxShootingStars) return;

                        const shootingStar = {
                            x: Math.random() * width,
                            y: Math.random() * height,
                            radius: Math.random() * 1.2 + 0.3, // Smaller shooting stars
                            alpha: Math.random() * 0.6 + 0.2,
                            speedX: (Math.random() - 0.5) * 2.5,
                            speedY: (Math.random() - 0.5) * 1.5,
                            isShootingStar: true,
                            trail: [],
                            createdAt: Date.now(),
                            lifespan: 2500 // 2.5 seconds
                        };

                        particles.push(shootingStar);
                        activeShootingStars++;
                    }

                    // Create shooting stars more frequently
                    setInterval(createShootingStar, 3000); // 3 seconds between shooting stars

                    // Performance monitoring
                    let frameCount = 0;
                    let lastTime = Date.now();
                    let fps = 60;
                    
                    function animate() {
                        try {
                            // Calculate FPS
                            frameCount++;
                            const currentTime = Date.now();
                            if (currentTime - lastTime >= 1000) {
                                fps = frameCount;
                                frameCount = 0;
                                lastTime = currentTime;
                                
                                // If FPS drops too low, reduce particles
                                if (fps < 30 && particles.length > 5000) {
                                    console.log('Low FPS detected:', fps, '- reducing particles');
                                    particles.splice(5000); // Keep only first 5000 particles
                                }
                            }
                            
                            ctx.clearRect(0, 0, width, height);
                            
                            // Filter out expired shooting stars and update active count
                            const validParticles = particles.filter(p => {
                                if (p.isShootingStar) {
                                    const age = currentTime - p.createdAt;
                                    if (age > p.lifespan) {
                                        activeShootingStars--;
                                        return false; // Remove expired shooting star
                                    }
                                }
                                return true;
                            });
                            
                            // Update particles array
                            particles.length = 0;
                            particles.push(...validParticles);
                            
                            particles.forEach(p => {
                                if (p.isShootingStar) {
                                    const age = currentTime - p.createdAt;
                                    const fadeOut = Math.max(0, 1 - (age / p.lifespan)); // Fade out over lifespan
                                    
                                    // Draw shooting star trail
                                    if (p.trail.length > 0) {
                                        ctx.beginPath();
                                        ctx.moveTo(p.x, p.y);
                                        for (let i = p.trail.length - 1; i >= 0; i--) {
                                            const trailPoint = p.trail[i];
                                            ctx.lineTo(trailPoint.x, trailPoint.y);
                                        }
                                        ctx.strokeStyle = `rgba(255, 255, 255, ${p.alpha * 0.3 * fadeOut})`;
                                        ctx.lineWidth = p.radius * 0.5;
                                        ctx.stroke();
                                    }

                                    // Draw shooting star
                                    ctx.beginPath();
                                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                                    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * fadeOut})`;
                                    ctx.fill();

                                    // Update trail
                                    p.trail.push({x: p.x, y: p.y});
                                    if (p.trail.length > 8) { // Shorter trail for performance
                                        p.trail.shift();
                                    }
                                } else {
                                    // Regular particle
                                    ctx.beginPath();
                                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                                    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                                    ctx.fill();
                                }

                                p.x += p.speedX;
                                p.y += p.speedY;

                                // Wrap around screen
                                if (p.x < 0) p.x = width;
                                if (p.x > width) p.x = 0;
                                if (p.y < 0) p.y = height;
                                if (p.y > height) p.y = 0;
                            });
                            
                            // Use requestAnimationFrame with fallback
                            if (window.requestAnimationFrame) {
                                requestAnimationFrame(animate);
                            } else {
                                setTimeout(animate, 16); // ~60fps fallback
                            }
                        } catch (error) {
                            console.error('Error in dust animation:', error);
                            // Stop animation on error
                        }
                    }

                    // Start animation with error handling
                    try {
                        animate();
                        console.log('Dust particles initialized successfully');
                    } catch (error) {
                        console.error('Failed to initialize dust particles:', error);
                    }
                }
            } catch (error) {
                console.error('Error setting up dust particles:', error);
            }
        }
    </script>
