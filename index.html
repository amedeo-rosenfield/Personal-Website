    <script>
        // Handle rocket animation transition from initial to infinite
        document.addEventListener('DOMContentLoaded', function() {
            const floatingElements = document.querySelectorAll('.floating-element');
            floatingElements.forEach(element => {
                element.addEventListener('animationend', function() {
                    if (!this.classList.contains('initial-animation-complete')) {
                        this.classList.add('initial-animation-complete');
                    }
                });
            });
        });

        // Simplified, consistent dust particles system
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('dustCanvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            
            // Set canvas size
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            const width = canvas.width;
            const height = canvas.height;
            
                         // Consistent particle configuration across all browsers
             const numParticles = 5000; // Bright particles
             const numLessBrightParticles = 5000; // Less bright particles
             const maxShootingStars = 15; // Always 15 shooting stars on screen
            
            const particles = [];
            let activeShootingStars = 0;
            
                                      // Create bright particles
             for (let i = 0; i < numParticles; i++) {
                 const isMotionless = Math.random() < 0.95; // 95% static for consistency
                 
                 let speedX = 0;
                 let speedY = 0;
                 let radius = Math.random() * 0.4 + 0.08; // Slightly larger for more visibility
                 let alpha = Math.random() * 0.8 + 0.4; // Brighter particles for Milky Way effect
                 
                 if (!isMotionless) {
                     // Very slow, consistent movement
                     speedX = (Math.random() - 0.5) * 0.05;
                     speedY = (Math.random() - 0.5) * 0.05;
                 }
                 
                 particles.push({
                     x: Math.random() * width,
                     y: Math.random() * height,
                     radius: radius,
                     alpha: alpha,
                     speedX: speedX,
                     speedY: speedY,
                     isShootingStar: false,
                     trail: null,
                     createdAt: Date.now()
                 });
             }
             
             // Create less bright particles
             for (let i = 0; i < numLessBrightParticles; i++) {
                 const isMotionless = Math.random() < 0.95; // 95% static for consistency
                 
                 let speedX = 0;
                 let speedY = 0;
                 let radius = Math.random() * 0.3 + 0.05; // Smaller for subtle effect
                 let alpha = Math.random() * 0.2 + 0.05; // Much less bright for depth
                 
                 if (!isMotionless) {
                     // Very slow, consistent movement
                     speedX = (Math.random() - 0.5) * 0.05;
                     speedY = (Math.random() - 0.5) * 0.05;
                 }
                 
                 particles.push({
                     x: Math.random() * width,
                     y: Math.random() * height,
                     radius: radius,
                     alpha: alpha,
                     speedX: speedX,
                     speedY: speedY,
                     isShootingStar: false,
                     trail: null,
                     createdAt: Date.now()
                 });
             }
            
                         // Simplified shooting star creation
             function createShootingStar() {
                 if (activeShootingStars >= maxShootingStars) return;
                 
                 const shootingStar = {
                     x: Math.random() * width,
                     y: Math.random() * height,
                     radius: Math.random() * 1.5 + 0.4, // Larger shooting stars
                     alpha: Math.random() * 1.0 + 0.6, // Much brighter shooting stars
                     speedX: (Math.random() - 0.5) * 2.5, // Faster horizontal movement
                     speedY: (Math.random() - 0.5) * 1.8, // Faster vertical movement
                     isShootingStar: true,
                     trail: [],
                     createdAt: Date.now(),
                     lifespan: 3000 // 3 seconds
                 };
                
                particles.push(shootingStar);
                activeShootingStars++;
            }
            
                         // Create shooting stars to maintain 3 on screen
             function maintainShootingStars() {
                 if (activeShootingStars < maxShootingStars) {
                     createShootingStar();
                 }
             }
             
             // Check every 3 seconds to maintain 15 shooting stars
             setInterval(maintainShootingStars, 3000);
            
            // Simplified animation loop
            function animate() {
                ctx.clearRect(0, 0, width, height);
                
                const currentTime = Date.now();
                
                // Update and draw particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    
                    if (p.isShootingStar) {
                        const age = currentTime - p.createdAt;
                        if (age > p.lifespan) {
                            particles.splice(i, 1);
                            activeShootingStars--;
                            continue;
                        }
                        
                        const fadeOut = Math.max(0, 1 - (age / p.lifespan));
                        
                        // Draw shooting star trail
                        if (p.trail.length > 0) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            for (let j = p.trail.length - 1; j >= 0; j--) {
                                const trailPoint = p.trail[j];
                                ctx.lineTo(trailPoint.x, trailPoint.y);
                            }
                                                     ctx.strokeStyle = `rgba(255, 255, 255, ${p.alpha * 0.5 * fadeOut})`;
                         ctx.lineWidth = p.radius * 0.8;
                         ctx.stroke();
                     }
                     
                     // Draw shooting star
                     ctx.beginPath();
                     ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                     ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * fadeOut})`;
                     ctx.fill();
                        
                        // Update trail
                        p.trail.push({x: p.x, y: p.y});
                        if (p.trail.length > 6) {
                            p.trail.shift();
                        }
                    } else {
                        // Regular particle - no flashing or twinkling
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                        ctx.fill();
                    }
                    
                    // Update position
                    p.x += p.speedX;
                    p.y += p.speedY;
                    
                    // Wrap around screen
                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;
                }
                
                requestAnimationFrame(animate);
            }
            
        // Start animation
        animate();
    });

    // Mobile menu toggle functionality
    document.addEventListener('DOMContentLoaded', function() {
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const navMenu = document.getElementById('nav-menu');
        
        if (mobileMenuToggle && navMenu) {
            mobileMenuToggle.addEventListener('click', function() {
                // Toggle mobile menu
                navMenu.classList.toggle('mobile-open');
                mobileMenuToggle.classList.toggle('active');
            });
            
            // Close mobile menu when clicking on a link
            const navLinks = navMenu.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                link.addEventListener('click', function() {
                    navMenu.classList.remove('mobile-open');
                    mobileMenuToggle.classList.remove('active');
                });
            });
            
            // Close mobile menu when clicking outside
            document.addEventListener('click', function(event) {
                if (!mobileMenuToggle.contains(event.target) && 
                    !navMenu.contains(event.target) && 
                    navMenu.classList.contains('mobile-open')) {
                    navMenu.classList.remove('mobile-open');
                    mobileMenuToggle.classList.remove('active');
                }
            });
            
            // Close mobile menu on window resize if screen becomes larger
            window.addEventListener('resize', function() {
                if (window.innerWidth > 767) {
                    navMenu.classList.remove('mobile-open');
                    mobileMenuToggle.classList.remove('active');
                }
            });
        }
    });
    </script>
