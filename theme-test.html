<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Test</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
    <style>
        .test-container {
            padding: 2rem;
            margin: 2rem;
            border: 2px solid var(--border-primary);
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .theme-info {
            background: var(--bg-tertiary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 8px;
        }
        .test-button {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin: 0.5rem;
        }
        .test-button:hover {
            background: var(--accent-tertiary);
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Theme Persistence Test</h1>
        
        <div class="theme-info">
            <h3>Current Theme Status:</h3>
            <p><strong>Data Theme Attribute:</strong> <span id="data-theme-display">Loading...</span></p>
            <p><strong>localStorage Theme:</strong> <span id="localstorage-display">Loading...</span></p>
            <p><strong>System Preference:</strong> <span id="system-preference">Loading...</span></p>
        </div>
        
        <div>
            <button id="theme-toggle" class="test-button">Toggle Theme</button>
            <button onclick="checkTheme()" class="test-button">Check Theme</button>
            <button onclick="clearStorage()" class="test-button">Clear localStorage</button>
        </div>
        
        <div class="theme-info">
            <h3>Navigation Test:</h3>
            <p>Click these links to test theme persistence across pages:</p>
            <a href="index.html" class="test-button">Home Page</a>
            <a href="bio.html" class="test-button">Bio Page</a>
            <a href="photography.html" class="test-button">Photography Page</a>
        </div>
    </div>
    
    <script>
        function checkTheme() {
            const dataTheme = document.documentElement.getAttribute('data-theme');
            const localStorageTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            document.getElementById('data-theme-display').textContent = dataTheme || 'not set';
            document.getElementById('localstorage-display').textContent = localStorageTheme || 'not set';
            document.getElementById('system-preference').textContent = systemPrefersDark ? 'dark' : 'light';
            
            console.log('Theme Check:', {
                dataTheme: dataTheme,
                localStorage: localStorageTheme,
                systemPrefersDark: systemPrefersDark
            });
        }
        
        function clearStorage() {
            localStorage.removeItem('theme');
            console.log('localStorage cleared');
            checkTheme();
        }
        
        // Check theme on page load
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(checkTheme, 100);
        });
    </script>
</body>
</html>
